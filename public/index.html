<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Case of the Stolen Crown</title><script src="/socket.io/socket.io.js"></script><style>:root{--paper:#f2eee4;--ink:#24221d;--gold:#c9aa63}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#312d24,#11110f 55%);color:#f4f0e8;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px}.brand{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.hero{padding:7vh 0}.hero h1,h1,h2,h3{font-family:Georgia,serif}.hero h1{font-size:clamp(42px,8vw,82px);line-height:.93}.hero p{max-width:700px;color:#c8c2b7;font-size:18px;line-height:1.6}.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0009;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.input{width:100%;padding:13px;border:1px solid #d0c7b6;border-radius:10px;margin:6px 0;font-size:16px}.btn{border:0;border-radius:10px;background:var(--gold);color:#191713;font-weight:800;padding:13px 17px;cursor:pointer}.btn:disabled{opacity:.4}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab,.vote{border:1px solid #d0c7b6;background:#e5dfd3;padding:10px;border-radius:9px;cursor:pointer}.vote{display:block;width:100%;text-align:left;margin:8px 0}.vote.selected{outline:3px solid var(--gold)}.clue{border-left:4px solid var(--gold);background:#e7e0d2;padding:13px;margin:10px 0;border-radius:8px}.portrait{width:76px;height:76px;border-radius:50%;object-fit:cover;float:right;border:2px solid var(--gold)}small{color:#6e685d}.secret{background:#29261f;color:#eee8da;border-radius:12px;padding:14px}</style></head><body><main id="app"></main><script>
const socket=io(),app=document.getElementById("app");let state=null,tab="case",selected=null;function esc(s){return String(s??"").replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]})}function render(){if(!state)return landing();if(state.phase==="LOBBY")return lobby();if(state.phase==="BRIEFING")return briefing();if(state.phase==="INVESTIGATION")return investigation();return reveal()}
function landing(){app.innerHTML='<section class="hero"><div class="brand">Blackwood Museum of Art · Multiplayer Mystery</div><h1>The Case of the<br>Stolen Crown</h1><p>The Star of Alexandria is gone. One player is secretly the Thief. Everyone else must assemble the evidence before making a private accusation.</p><div class="card grid"><div><h2>Create a room</h2><input id="cn" class="input" placeholder="Detective name"><button class="btn" onclick="create()">Create Room</button></div><div><h2>Join a room</h2><input id="jn" class="input" placeholder="Detective name"><input id="rc" class="input" placeholder="Room code" maxlength="5"><button class="btn" onclick="join()">Join Room</button></div></div><small>2–8 players · separate phones or browser windows · no app required</small></section>'}
function create(){socket.emit("create",{name:document.getElementById("cn").value})}function join(){socket.emit("join",{name:document.getElementById("jn").value,code:document.getElementById("rc").value})}
function lobby(){app.innerHTML='<div class="brand">ROOM '+esc(state.code)+'</div><div class="card"><h1>Case Room</h1><p>Share <b>'+esc(state.code)+'</b> with the other detectives.</p><div class="grid">'+state.players.map(function(p){return '<div class="card"><b>'+esc(p.name)+'</b><br><small>'+(p.connected?"Connected":"Disconnected")+'</small></div>'}).join("")+'</div>'+(state.me.id===state.hostId?'<button class="btn" '+(state.players.length<2?"disabled":"")+' onclick="socket.emit(\'start\')">Start Case</button>':"<p>Waiting for the host…</p>")+'</div>'}
function briefing(){app.innerHTML='<div class="brand">BRIEFING · '+esc(state.code)+'</div><div class="card"><h1>'+esc(state.caseData.title)+'</h1><p>'+esc(state.caseData.crime)+'</p><div class="secret"><b>'+esc(state.me.characterName)+'</b> · '+esc(state.me.occupation)+'<br><br><b>Your secret role: '+esc(state.me.role)+'</b><br><small style="color:#d5cec0">Keep this screen private.</small></div><button class="btn" onclick="socket.emit(\'beginInvestigation\')">Begin Investigation</button></div>'}
function investigation(){const left=Math.max(0,(state.endsAt-Date.now())/1000);app.innerHTML='<div class="brand">INVESTIGATION · '+esc(state.code)+' · <b>'+Math.ceil(left/60)+'m '+Math.ceil(left%60)+'s</b></div><div class="card"><h1>Build the case.</h1><div class="tabs"><button class="tab" onclick="tab=\'case\';render()">Case Info</button><button class="tab" onclick="tab=\'timeline\';render()">Timeline</button><button class="tab" onclick="tab=\'evidence\';render()">Evidence</button><button class="tab" onclick="tab=\'clues\';render()">Your Clues</button><button class="tab" onclick="tab=\'accuse\';render()">Accuse</button></div>'+panel()+'</div>'}
function panel(){if(tab==="timeline")return state.caseData.timeline.map(function(x){return '<div class="clue">'+esc(x)+'</div>'}).join("");if(tab==="evidence")return state.caseData.publicEvidence.map(function(x){return '<div class="clue">'+esc(x.text)+'</div>'}).join("");if(tab==="clues")return '<p><small>Only you can see these clues.</small></p>'+state.me.privateClues.map(function(x){return '<div class="clue"><b>'+esc(x.title)+'</b><br>'+esc(x.text)+'</div>'}).join("");if(tab==="accuse")return '<h2>Final Accusation</h2>'+state.players.filter(function(p){return p.id!==state.me.id}).map(function(p){return '<button class="vote '+(selected===p.character?"selected":"")+'" onclick="selected=\''+p.character+'\';render()"><b>'+esc(p.characterName)+'</b><br><small>'+esc(p.occupation)+'</small></button>'}).join("")+'<button class="btn" '+(!selected?"disabled":"")+' onclick="socket.emit(\'accuse\',{targetId:state.players.find(function(p){return p.character===selected}).id})">Submit Accusation</button><p><small>'+state.votesSubmitted+'/'+state.voteCount+' submitted.</small></p>';return '<h2>Every participant</h2><div class="grid">'+state.caseData.profiles.map(function(p){return '<div class="card"><img class="portrait" src="/art/'+esc(p.portrait)+'"><h3>'+esc(p.name)+'</h3><small>'+esc(p.occupation)+' · '+(p.age||"")+'</small><p>'+esc(p.profile)+'</p><p><b>Motive:</b> '+esc(p.motive)+'</p>'+(p.npc?"<small>Static NPC · never the Thief</small>":"")+'</div>'}).join("")+'</div>'}
function reveal(){const thief=state.players.find(function(p){return p.character===state.caseData.truth.thiefId});app.innerHTML='<div class="brand">CASE CLOSED</div><div class="card"><h1>The Thief was '+esc(thief&&thief.characterName)+'</h1><p>'+esc(state.caseData.crime)+'</p><div class="clue">The blackout created the critical 11:43–11:45 PM window.</div><div class="clue">The movement route and private observations connect the Thief to the disappearance.</div><h2>Scoreboard</h2>'+[...state.players].sort(function(a,b){return b.score-a.score}).map(function(p){return '<p><b>'+esc(p.name)+'</b> · '+esc(p.characterName)+' — '+p.score+'</p>'}).join("")+(state.me.id===state.hostId?"<button class='btn' onclick=\"socket.emit('rematch')\">New Case</button>":"")+'</div>'}
socket.on("state",function(s){state=s;render()});socket.on("errorMsg",function(m){alert(m)});setInterval(function(){if(state&&state.phase==="INVESTIGATION")render()},1000);render();
</script></body></html>
