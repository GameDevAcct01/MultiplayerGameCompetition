<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Case of the Stolen Crown</title><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#151514;--paper:#f3efe5;--ink:#201f1b;--gold:#c7a75b;--muted:#a9a294}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25231f,#121211 55%);color:#f5f1e8;font-family:Inter,system-ui,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px 18px}.brand{letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-size:12px}.hero{padding:8vh 0 4vh}.hero h1{font:clamp(42px,8vw,82px) Georgia,serif;line-height:.95;margin:10px 0 18px}.hero p{max-width:680px;color:#c9c4b9;font-size:18px;line-height:1.6}.card{background:rgba(243,239,229,.96);color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0008;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.btn{border:0;border-radius:10px;padding:13px 17px;font-weight:750;cursor:pointer;background:var(--gold);color:#181713}.btn.secondary{background:#282721;color:#f6f1e7}.input{padding:13px;border-radius:10px;border:1px solid #b9b2a5;font-size:16px;width:100%;margin:6px 0}.pill{display:inline-block;border:1px solid #bdb5a5;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.clue{border-left:4px solid var(--gold);padding:12px;background:#e8e2d5;margin:10px 0;border-radius:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#ddd5c6;border:0;padding:10px;border-radius:8px;cursor:pointer}.timer{font:700 24px Georgia,serif;color:#6e5521}.vote{width:100%;text-align:left;background:#eee8dc;border:1px solid #c4bbab;padding:13px;border-radius:10px;margin:7px 0;cursor:pointer}.vote.selected{outline:3px solid var(--gold)}small{color:#6d675d}
</style></head><body><main id="app"></main><script>
const s=io(); let state=null,selected=null,view='case'; const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!state){app.innerHTML=`<div class="hero"><div class="brand">Blackwood Museum of Art · Interactive Mystery</div><h1>The Case of the<br>Stolen Crown</h1><p>A real-time multiplayer deduction game for 2–8 players. One of you stole the Star of Alexandria. Everyone else has to prove it.</p><div class="card grid"><div><h2>Create a case</h2><input class="input" id="name" placeholder="Your detective name"><button class="btn" onclick="create()">Create Room</button></div><div><h2>Join a case</h2><input class="input" id="joinname" placeholder="Your detective name"><input class="input" id="code" placeholder="Room code" maxlength="5"><button class="btn" onclick="join()">Join Room</button></div></div><p><small>Best played on separate phones or browser windows. No app required.</small></p></div>`;return}
if(state.phase==='LOBBY')return lobby();if(state.phase==='BRIEFING')return briefing();if(state.phase==='INVESTIGATION')return investigation();if(state.phase==='REVEAL')return reveal();}
function create(){s.emit('create',{name:document.getElementById('name').value})}function join(){s.emit('join',{name:document.getElementById('joinname').value,code:document.getElementById('code').value})}
function lobby(){app.innerHTML=`<div class="brand">ROOM ${esc(state.code)}</div><div class="card"><h1>Case Room</h1><p>Share this code: <b>${esc(state.code)}</b></p><div class="grid">${state.players.map(p=>`<div class="card"><b>${esc(p.name)}</b><br><small>${p.connected?'Connected':'Disconnected'}</small></div>`).join('')}</div>${state.me.id===state.hostId?`<button class="btn" ${state.players.length<2?'disabled':''} onclick="s.emit('start')">Start Case (${state.players.length}/8)</button>`:'<p>Waiting for the host to start…</p>'}</div>`}
function briefing(){app.innerHTML=`<div class="brand">BRIEFING · ${esc(state.code)}</div><div class="card"><h1>The Star is gone.</h1><p>${esc(state.caseData.crime)}</p><h3>Your identity</h3><p><b>${esc(state.me.characterName)}</b> — ${esc(state.me.occupation)}</p><p>Your secret role: <b>${esc(state.me.role)}</b></p><p><small>Your role is private. Do not show your screen to other players.</small></p><button class="btn" onclick="s.emit('beginInvestigation')">Begin Investigation</button></div>`}
function investigation(){app.innerHTML=`<div class="brand">INVESTIGATION · ROOM ${esc(state.code)}</div><div class="card"><h1>Build the case.</h1><div class="tabs"><button class="tab" onclick="view='case';render()">Case Info</button><button class="tab" onclick="view='timeline';render()">Timeline</button><button class="tab" onclick="view='evidence';render()">Evidence</button><button class="tab" onclick="view='clues';render()">Your Clues</button><button class="tab" onclick="view='accuse';render()">Accuse</button></div>${panel()}</div>`}
function panel(){if(view==='timeline')return `<h2>Public Timeline</h2>${state.caseData.timeline.map(x=>`<div class="clue">${esc(x)}</div>`).join('')}`;if(view==='evidence')return `<h2>Public Evidence</h2>${state.caseData.publicEvidence.map(x=>`<div class="clue">${esc(x)}</div>`).join('')}`;if(view==='clues')return `<h2>Your Private Clues</h2><p><small>These are visible only to you.</small></p>${state.me.privateClues.map(x=>`<div class="clue">${esc(x)}</div>`).join('')}`;if(view==='accuse')return `<h2>Final Accusation</h2><p>Select the player you believe stole the Star. Your vote is private.</p>${state.players.map(p=>p.id===state.me.id?'':`<button class="vote ${selected===p.id?'selected':''}" onclick="selected='${p.id}';render()"><b>${esc(p.characterName)}</b><br><small>${esc(p.occupation)}</small></button>`).join('')}<button class="btn" ${!selected?'disabled':''} onclick="s.emit('accuse',{targetId:selected})">Submit Accusation</button>`;return `<h2>Case Info</h2><div class="grid">${state.caseData.caseProfiles.map(p=>`<div class="card"><h3>${esc(p.character)}</h3><small>${esc(p.occupation)}</small><p>${esc(p.description)}</p></div>`).join('')}</div>`}
function reveal(){const thief=state.players.find(p=>p.id===state.caseData.solution.thiefId);app.innerHTML=`<div class="brand">CASE CLOSED</div><div class="card"><h1>The Thief was ${esc(thief?.characterName)}.</h1><p>${esc(state.caseData.crime)}</p><h2>Evidence chain</h2><div class="clue">The public timeline establishes the blackout and discovery window.</div><div class="clue">Private observations connect movement around East Hall and the Service Corridor to the critical window.</div><h2>Scoreboard</h2>${[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<p><b>${esc(p.name)}</b> · ${esc(p.characterName)} — ${p.score} points</p>`).join('')}${state.me.id===state.hostId?`<button class="btn" onclick="s.emit('rematch')">New Case</button>`:''}</div>`}
s.on('state',x=>{state=x;render()});s.on('errorMsg',x=>alert(x));render();
</script></main></body></html>
